
name: Build CNC Programmer AI APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Web Assets and Capacitor
        run: |
          mkdir -p www
          cp *.html *.css *.js *.json www/ 2>/dev/null || true
          if [ ! -f package.json ]; then
            npm init -y
          fi
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "CNC Programmer AI" "com.cncprogrammer.ai" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload CNC Programmer AI APK
        uses: actions/upload-artifact@v4
        with:
          name: CNC-Programmer-AI-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
